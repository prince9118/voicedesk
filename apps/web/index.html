<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>VoiceDesk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!--
      Apply the theme before the first paint. Without this, a dark-mode user reloading the page would
      see a flash of the light theme while the React bundle downloads. Saved choice wins, otherwise
      follow the OS. Keep in sync with src/ui/theme.tsx. (A future Content-Security-Policy must allow
      this one inline script by its hash.)
    -->
    <script>
      (function () {
        var theme = "dark";
        try {
          var saved = localStorage.getItem("voicedesk.theme");
          theme = saved === "light" || saved === "dark" ? saved : matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
