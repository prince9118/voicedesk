# Production stack for a single server. Configure deploy/.env (see deploy/.env.example), then:
#   docker compose -f docker-compose.prod.yml --env-file deploy/.env up -d --build
# Only Caddy is reachable from outside (ports 80 and 443). Postgres, the API and the agent talk on the
# private compose network.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: voicedesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: voicedesk
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voicedesk -d voicedesk"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      PORT: "4000"
      DATABASE_URL: postgresql://voicedesk:${POSTGRES_PASSWORD}@postgres:5432/voicedesk
      LIVEKIT_URL: ${LIVEKIT_URL:?}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?}
      AGENT_API_KEY: ${AGENT_API_KEY:?}
      TRUST_PROXY: "true"
      VOICE_SESSIONS_PER_USER_PER_DAY: ${VOICE_SESSIONS_PER_USER_PER_DAY:-3}
      VOICE_SESSIONS_PER_DAY: ${VOICE_SESSIONS_PER_DAY:-30}
      REGISTRATIONS_PER_IP_PER_HOUR: ${REGISTRATIONS_PER_IP_PER_HOUR:-5}
      LOGIN_ATTEMPTS_PER_IP_PER_15_MIN: ${LOGIN_ATTEMPTS_PER_IP_PER_15_MIN:-10}
    healthcheck:
      # Readiness, not just liveness: the API answers and can reach the database.
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6

  agent:
    build: { context: ., dockerfile: apps/agent/Dockerfile }
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    environment:
      LIVEKIT_URL: ${LIVEKIT_URL:?}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?}
      AGENT_API_KEY: ${AGENT_API_KEY:?}
      VOICEDESK_API_URL: http://api:4000
      AGENT_MAX_CALL_MINUTES: ${AGENT_MAX_CALL_MINUTES:-10}
      AGENT_RECORD_SESSIONS: "false"

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - caddy_data:/data # certificates: keep them across restarts (Let's Encrypt has rate limits)
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
